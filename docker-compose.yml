version: '3'

networks:
  redis-cluster-compose:
    driver: bridge

services:
  redis-node-1:
    image: redis:latest
    ports:
      - 7000:7000
    networks:
      - redis-cluster-compose
    hostname: redis-node-1
    volumes:
      - ./7000:/data
    command: ["redis-server", "/data/redis.conf"]

  redis-node-2:
    image: redis:latest
    ports:
      - 7001:7001
    networks:
      - redis-cluster-compose
    hostname: redis-node-2
    volumes:
      - ./7001:/data
    command: ["redis-server", "/data/redis.conf"]

  redis-node-3:
    image: redis:latest
    ports:
      - 7002:7002
    networks:
      - redis-cluster-compose
    hostname: redis-node-3
    volumes:
      - ./7002:/data
    command: ["redis-server", "/data/redis.conf"]

  redis-node-4:
    image: redis:latest
    ports:
      - 7003:7003
    networks:
      - redis-cluster-compose
    hostname: redis-node-4
    volumes:
      - ./7003:/data
    command: ["redis-server", "/data/redis.conf"]

  redis-node-5:
    image: redis:latest
    ports:
      - 7004:7004
    networks:
      - redis-cluster-compose
    hostname: redis-node-5
    volumes:
      - ./7004:/data
    command: ["redis-server", "/data/redis.conf"]

  redis-node-6:
    image: redis:latest
    ports:
      - 7005:7005
    networks:
      - redis-cluster-compose
    hostname: redis-node-6
    volumes:
      - ./7005:/data
    command: ["redis-server", "/data/redis.conf"]

  redis-cluster-creator:
    image: redis:latest
    networks:
      - redis-cluster-compose
    command: >
      bash -c '
      sleep 10 &&
      redis-cli --cluster create \
          $(hostname -i):7000 \
          $(hostname -i):7001 \
          $(hostname -i):7002 \
          $(hostname -i):7003 \
          $(hostname -i):7004 \
          $(hostname -i):7005 \
          --cluster-replicas 1'
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6

