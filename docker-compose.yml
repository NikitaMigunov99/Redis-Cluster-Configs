version: "3.9"

services:
  redis-node-1:
    image: redis:8.4
    container_name: redis-node-1
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./redis/users.acl:/usr/local/etc/redis/users.acl
    ports:
      - "7001:6379"
    networks: [redis-net]

  redis-node-2:
    image: redis:8.4
    container_name: redis-node-2
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./redis/users.acl:/usr/local/etc/redis/users.acl
    ports:
      - "7002:6379"
    networks: [redis-net]

  redis-node-3:
